<div class="content-scroll">
  <section class="track-section">
    <div class="section-heading">
      <div>
        <span class="eyebrow">YOUR COLLECTION</span>
        <h2>
          {{
            collectionView() === 'albums'
              ? 'Albums'
              : collectionView() === 'artists'
                ? 'Artists'
                : collectionView() === 'folders'
                  ? 'Folders'
                  : searchQuery()
                    ? 'Track results'
                    : 'Tracks'
          }}
        </h2>
      </div>
      <div class="collection-actions">
        <div
          class="collection-tabs"
          [class.albums-active]="collectionView() === 'albums'"
          [class.artists-active]="collectionView() === 'artists'"
          [class.tracks-active]="collectionView() === 'tracks'"
          [class.folders-active]="collectionView() === 'folders'"
          role="tablist"
          aria-label="Library pages"
        >
          <button
            id="library-tab-albums"
            role="tab"
            [attr.aria-selected]="collectionView() === 'albums'"
            [attr.aria-controls]="'library-panel-albums'"
            [tabIndex]="collectionView() === 'albums' ? 0 : -1"
            [class.active]="collectionView() === 'albums'"
            (click)="selectTab('albums')"
            (keydown)="onTabKeydown($event, 'albums')"
          >
            Albums
          </button>
          <button
            id="library-tab-artists"
            role="tab"
            [attr.aria-selected]="collectionView() === 'artists'"
            [attr.aria-controls]="'library-panel-artists'"
            [tabIndex]="collectionView() === 'artists' ? 0 : -1"
            [class.active]="collectionView() === 'artists'"
            (click)="selectTab('artists')"
            (keydown)="onTabKeydown($event, 'artists')"
          >
            Artists
          </button>
          <button
            id="library-tab-tracks"
            role="tab"
            [attr.aria-selected]="collectionView() === 'tracks'"
            [attr.aria-controls]="'library-panel-tracks'"
            [tabIndex]="collectionView() === 'tracks' ? 0 : -1"
            [class.active]="collectionView() === 'tracks'"
            (click)="selectTab('tracks')"
            (keydown)="onTabKeydown($event, 'tracks')"
          >
            Tracks
          </button>
          <button
            id="library-tab-folders"
            role="tab"
            [attr.aria-selected]="collectionView() === 'folders'"
            [attr.aria-controls]="'library-panel-folders'"
            [tabIndex]="collectionView() === 'folders' ? 0 : -1"
            [class.active]="collectionView() === 'folders'"
            (click)="selectTab('folders')"
            (keydown)="onTabKeydown($event, 'folders')"
          >
            Folders
          </button>
        </div>
        <button
          class="see-all"
          type="button"
          (click)="refreshLibrary()"
          aria-label="Refresh library"
          title="Refresh library"
        >
          Refresh
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M20 7v5h-5M4 17v-5h5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
    <div
      #collectionPanelContainer
      class="collection-panel-container"
      [style.min-height.px]="tabPanelMinHeight()"
    >
      <div
        id="library-panel-tracks"
        class="collection-tab-panel"
        role="tabpanel"
        aria-labelledby="library-tab-tracks"
        [class.active]="collectionView() === 'tracks'"
        [class.exiting]="tabTransition()?.from === 'tracks'"
        [class.enter-from-right]="
          tabTransition()?.to === 'tracks' && tabTransition()?.direction === 'right'
        "
        [class.enter-from-left]="
          tabTransition()?.to === 'tracks' && tabTransition()?.direction === 'left'
        "
        [class.exit-to-left]="
          tabTransition()?.from === 'tracks' && tabTransition()?.direction === 'right'
        "
        [class.exit-to-right]="
          tabTransition()?.from === 'tracks' && tabTransition()?.direction === 'left'
        "
        [attr.aria-hidden]="collectionView() !== 'tracks'"
        [attr.inert]="collectionView() !== 'tracks' ? '' : null"
        tabindex="0"
        (animationend)="finishTabTransition('tracks', $event)"
      >
        <app-library-tracks-page
          [active]="collectionView() === 'tracks'"
          [refreshTrigger]="refreshTrigger()"
        />
      </div>
      <div
        id="library-panel-albums"
        class="collection-tab-panel"
        role="tabpanel"
        aria-labelledby="library-tab-albums"
        [class.active]="collectionView() === 'albums'"
        [class.exiting]="tabTransition()?.from === 'albums'"
        [class.enter-from-right]="
          tabTransition()?.to === 'albums' && tabTransition()?.direction === 'right'
        "
        [class.enter-from-left]="
          tabTransition()?.to === 'albums' && tabTransition()?.direction === 'left'
        "
        [class.exit-to-left]="
          tabTransition()?.from === 'albums' && tabTransition()?.direction === 'right'
        "
        [class.exit-to-right]="
          tabTransition()?.from === 'albums' && tabTransition()?.direction === 'left'
        "
        [attr.aria-hidden]="collectionView() !== 'albums'"
        [attr.inert]="collectionView() !== 'albums' ? '' : null"
        tabindex="0"
        (animationend)="finishTabTransition('albums', $event)"
      >
        <app-library-albums-page
          [active]="collectionView() === 'albums'"
          [refreshTrigger]="refreshTrigger()"
        />
      </div>
      <div
        id="library-panel-artists"
        class="collection-tab-panel"
        role="tabpanel"
        aria-labelledby="library-tab-artists"
        [class.active]="collectionView() === 'artists'"
        [class.exiting]="tabTransition()?.from === 'artists'"
        [class.enter-from-right]="
          tabTransition()?.to === 'artists' && tabTransition()?.direction === 'right'
        "
        [class.enter-from-left]="
          tabTransition()?.to === 'artists' && tabTransition()?.direction === 'left'
        "
        [class.exit-to-left]="
          tabTransition()?.from === 'artists' && tabTransition()?.direction === 'right'
        "
        [class.exit-to-right]="
          tabTransition()?.from === 'artists' && tabTransition()?.direction === 'left'
        "
        [attr.aria-hidden]="collectionView() !== 'artists'"
        [attr.inert]="collectionView() !== 'artists' ? '' : null"
        tabindex="0"
        (animationend)="finishTabTransition('artists', $event)"
      >
        <app-library-artists-page
          [active]="collectionView() === 'artists'"
          [refreshTrigger]="refreshTrigger()"
        />
      </div>
      <div
        id="library-panel-folders"
        class="collection-tab-panel"
        role="tabpanel"
        aria-labelledby="library-tab-folders"
        [class.active]="collectionView() === 'folders'"
        [class.exiting]="tabTransition()?.from === 'folders'"
        [class.enter-from-right]="
          tabTransition()?.to === 'folders' && tabTransition()?.direction === 'right'
        "
        [class.enter-from-left]="
          tabTransition()?.to === 'folders' && tabTransition()?.direction === 'left'
        "
        [class.exit-to-left]="
          tabTransition()?.from === 'folders' && tabTransition()?.direction === 'right'
        "
        [class.exit-to-right]="
          tabTransition()?.from === 'folders' && tabTransition()?.direction === 'left'
        "
        [attr.aria-hidden]="collectionView() !== 'folders'"
        [attr.inert]="collectionView() !== 'folders' ? '' : null"
        tabindex="0"
        (animationend)="finishTabTransition('folders', $event)"
      >
        <app-library-folders-page
          [active]="collectionView() === 'folders'"
          [refreshTrigger]="refreshTrigger()"
        />
      </div>
    </div>
  </section>
  <footer class="page-footer">
    <span>YOUR MUSIC, YOUR MOMENT.</span><span>MADE FOR THE IN-BETWEEN</span>
  </footer>
</div>
