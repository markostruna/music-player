<aside class="sidebar">
  <div class="nav-group">
    <span class="nav-label">MENU</span>
    <a
      class="nav-item"
      routerLink="/now-playing"
      routerLinkActive="selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 10.5 12 4l8 6.5V20h-6v-6h-4v6H4v-9.5Z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
      Now playing
    </a>
    <button
      type="button"
      class="nav-item"
      [class.selected]="isLibraryPage() && activeSection() === 'Discover'"
      (click)="activeSectionChange.emit('Discover')"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
        <path
          d="m15.5 8.5-2 5-5 2 2-5 5-2Z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
      Discover
    </button>
    <a
      class="nav-item"
      routerLink="/library"
      routerLinkActive="selected"
      [routerLinkActiveOptions]="{ exact: false }"
      (click)="activeSectionChange.emit('Your library')"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M5 4.5h13a1 1 0 0 1 1 1v14H7a2 2 0 0 1-2-2v-13Zm0 13a2 2 0 0 0 2 2m2-15v12m4-12v12"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Your library
    </a>
    <a
      class="nav-item"
      routerLink="/playlists"
      routerLinkActive="selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4.5 5.5h15m-15 6h15m-15 6h9"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
        <circle cx="17.5" cy="17.5" r="2.5" stroke="currentColor" stroke-width="1.7" />
      </svg>
      Playlists
    </a>
    <a
      class="nav-item"
      routerLink="/settings"
      routerLinkActive="selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6" />
        <path
          d="m19.4 13.5 1.1.8-1.5 2.6-1.3-.5a7.8 7.8 0 0 1-1.5.9l-.2 1.4h-3l-.3-1.4a7.8 7.8 0 0 1-1.5-.9l-1.3.5-1.5-2.6 1.1-.8a7.6 7.6 0 0 1 0-1.8l-1.1-.8 1.5-2.6 1.3.5a7.8 7.8 0 0 1 1.5-.9l.3-1.4h3l.2 1.4a7.8 7.8 0 0 1 1.5.9l1.3-.5 1.5 2.6-1.1.8a7.6 7.6 0 0 1 0 1.8Z"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linejoin="round"
        />
      </svg>
      Settings
    </a>
  </div>

</aside>
