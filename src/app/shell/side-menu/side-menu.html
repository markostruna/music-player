<aside class="sidebar">
  <a class="wordmark" routerLink="/library" aria-label="Afterhours home">
    <span class="brand-mark" aria-hidden="true">a.</span>
    <span>afterhours</span>
  </a>

  <div class="nav-group">
    <span class="nav-label">MENU</span>
    <a
      class="nav-item"
      routerLink="/now-playing"
      routerLinkActive="selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 10.5 12 4l8 6.5V20h-6v-6h-4v6H4v-9.5Z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
      Now playing
    </a>
    <button
      type="button"
      class="nav-item"
      [class.selected]="isLibraryPage() && activeSection() === 'Discover'"
      (click)="activeSectionChange.emit('Discover')"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
        <path
          d="m15.5 8.5-2 5-5 2 2-5 5-2Z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
      Discover
    </button>
    <a
      class="nav-item"
      routerLink="/library"
      routerLinkActive="selected"
      [routerLinkActiveOptions]="{ exact: false }"
      (click)="activeSectionChange.emit('Your library')"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M5 4.5h13a1 1 0 0 1 1 1v14H7a2 2 0 0 1-2-2v-13Zm0 13a2 2 0 0 0 2 2m2-15v12m4-12v12"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Your library
    </a>
  </div>

  <div class="nav-group playlist-group">
    <div class="nav-label-row">
      <span class="nav-label">YOUR PLAYLISTS</span>
      <button type="button" class="add-button" aria-label="Create playlist" title="Create playlist">
        +
      </button>
    </div>
    <button
      type="button"
      class="playlist-link"
      [class.playlist-active]="isLibraryPage() && activeSection() === 'Late night drive'"
      (click)="activeSectionChange.emit('Late night drive')"
    >
      <span class="playlist-swatch swatch-lime"></span>Late night drive
    </button>
    <button
      type="button"
      class="playlist-link"
      [class.playlist-active]="isLibraryPage() && activeSection() === 'Sunday slowdown'"
      (click)="activeSectionChange.emit('Sunday slowdown')"
    >
      <span class="playlist-swatch swatch-peach"></span>Sunday slowdown
    </button>
    <button
      type="button"
      class="playlist-link"
      [class.playlist-active]="isLibraryPage() && activeSection() === 'Soft focus'"
      (click)="activeSectionChange.emit('Soft focus')"
    >
      <span class="playlist-swatch swatch-blue"></span>Soft focus
    </button>
  </div>

  <div class="sidebar-bottom">
    <button type="button" class="profile-row" (click)="signOutRequested.emit()" title="Sign out">
      <span class="avatar">{{ user()?.email?.slice(0, 1)?.toUpperCase() }}</span>
      <span class="profile-name">
        <strong>{{ user()?.email }}</strong>
        <small>{{ user()?.role }}</small>
      </span>
      <span class="profile-more">↪</span>
    </button>
  </div>
</aside>
