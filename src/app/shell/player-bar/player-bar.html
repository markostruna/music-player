@if (player.currentTrack(); as track) {
  <footer
    class="player-bar"
    [style.--player-cover]="'url(&quot;' + track.coverUrl + '&quot;)'"
  >
    <div class="now-playing-info">
      <a class="now-playing-art" routerLink="/now-playing" aria-label="Open Playing now"
        ><img
          [src]="track.coverUrl"
          [alt]="track.album + ' artwork'"
          (error)="$any($event.target).style.visibility = 'hidden'"
      /></a>
      <span class="now-playing-text">
        <a class="now-playing-title" routerLink="/now-playing"
          ><strong>{{ track.title }}</strong></a
        >
        <a class="now-playing-artist" routerLink="/now-playing"
          ><small>{{ track.artist }}</small></a
        >
        @if (player.errorMessage()) {
          <small class="player-error" role="alert">{{ player.errorMessage() }}</small>
        }
      </span>
    </div>
    <div class="player-controls">
      <div class="transport">
        <button
          type="button"
          class="mode-toggle"
          [class.active]="player.shuffle()"
          [attr.aria-pressed]="player.shuffle()"
          aria-label="Shuffle"
          title="Shuffle"
          (click)="player.shuffle.update((enabled) => !enabled)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 3h5v5M4 20l5.5-5.5M21 3l-8 8M14 13l2 2 5 5m0-5v5h-5M4 4l5 5" />
          </svg>
        </button>
        <button
          type="button"
          aria-label="Previous track"
          title="Previous track"
          (click)="player.previous()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 5v14M19 6l-9 6 9 6z" />
          </svg>
        </button>
        <button
          type="button"
          class="play-toggle"
          (click)="player.toggle()"
          [attr.aria-label]="player.isPlaying() ? 'Pause' : 'Play'"
          [title]="player.isPlaying() ? 'Pause' : 'Play'"
        >
          @if (player.isPlaying()) {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zm5 0h3v14h-3z" /></svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" /></svg>
          }
        </button>
        <button
          type="button"
          aria-label="Next track"
          title="Next track"
          [disabled]="!player.hasNext()"
          (click)="player.next()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 5v14M5 6l9 6-9 6z" />
          </svg>
        </button>
        <button
          type="button"
          class="mode-toggle"
          [class.active]="player.repeat()"
          [attr.aria-pressed]="player.repeat()"
          aria-label="Repeat track"
          title="Repeat track"
          (click)="player.repeat.update((enabled) => !enabled)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3" />
          </svg>
        </button>
      </div>
      <div class="progress-row">
        <span>{{ formatTime(player.currentTime()) }}</span>
        <input
          type="range"
          min="0"
          [max]="player.duration() || track.durationSeconds"
          [value]="player.currentTime()"
          (input)="seek($event)"
          aria-label="Playback position"
        />
        <span>{{ formatTime(player.duration() || track.durationSeconds) }}</span>
      </div>
    </div>
    <div class="player-extra">
      <label class="volume-label" aria-label="Volume"
        ><span aria-hidden="true">◖</span><input
          type="range"
          min="0"
          max="100"
          [value]="player.volumePercent()"
          (input)="setVolume($event)"
          aria-label="Volume"
        /><span aria-hidden="true">◖))</span
      ></label>
    </div>
  </footer>
}
