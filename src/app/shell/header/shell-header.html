<header class="topbar">
  <button
    type="button"
    class="menu-toggle"
    [attr.aria-label]="menuVisible() ? 'Hide navigation menu' : 'Show navigation menu'"
    [attr.aria-expanded]="menuVisible()"
    aria-controls="side-menu"
    (click)="menuToggle.emit()"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 6h16M4 12h16M4 18h16"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  </button>
  <a class="wordmark" routerLink="/library" aria-label="Afterhours home">
    <span class="brand-mark" aria-hidden="true">a.</span>
    <span>afterhours</span>
  </a>
  @if (isLibraryPage()) {
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.5" stroke="currentColor" stroke-width="1.7" />
        <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
      <input
        type="search"
        placeholder="Search tracks, albums, artists..."
        aria-label="Search tracks, albums, and artists"
        [value]="searchQuery()"
        (input)="searchQueryChange.emit($any($event.target).value)"
      />
      <kbd>⌘ K</kbd>
    </label>
  }
  <label class="theme-picker">
    <span>Theme</span>
    <select [value]="user()?.theme ?? 'Light'" (change)="themeChange.emit($event)">
      @for (theme of themeOptions(); track theme) {
        <option [value]="theme">{{ theme }}</option>
      }
    </select>
  </label>
  <button type="button" class="mobile-profile" (click)="signOutRequested.emit()" aria-label="Sign out">
    {{ user()?.email?.slice(0, 1)?.toUpperCase() }}
  </button>
</header>
