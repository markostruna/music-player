<header class="topbar">
  <div class="topbar-inner">
    <button
      type="button"
      class="menu-toggle"
      [attr.aria-label]="menuVisible() ? 'Hide navigation menu' : 'Show navigation menu'"
      [attr.aria-expanded]="menuVisible()"
      aria-controls="side-menu"
      (click)="menuToggle.emit()"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 6h16M4 12h16M4 18h16"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <a class="wordmark" routerLink="/library" aria-label="Afterhours home">
      <span class="brand-mark" aria-hidden="true">a.</span>
      <span>afterhours</span>
    </a>
    @if (isLibraryPage()) {
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.5" stroke="currentColor" stroke-width="1.7" />
          <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <input
          type="search"
          placeholder="Search tracks, albums, artists..."
          aria-label="Search tracks, albums, and artists"
          [value]="searchQuery()"
          (input)="searchQueryChange.emit($any($event.target).value)"
        />
        <kbd>⌘ K</kbd>
      </label>
    }
    <div class="account-menu-container" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="account-trigger"
        [attr.aria-expanded]="accountMenuOpen()"
        aria-haspopup="menu"
        [attr.aria-controls]="accountMenuOpen() ? 'account-menu' : null"
        (click)="toggleAccountMenu()"
      >
        <span class="account-avatar" aria-hidden="true">
          {{ user()?.email?.slice(0, 1)?.toUpperCase() }}
        </span>
        <span class="account-username">{{ user()?.email }}</span>
        <span class="visually-hidden">Open account menu</span>
      </button>
      @if (accountMenuOpen()) {
        <div id="account-menu" class="account-menu" role="menu" aria-label="Account menu">
          <button type="button" role="menuitem" disabled aria-disabled="true">Profile</button>
          <a
            routerLink="/settings"
            role="menuitem"
            (click)="closeAccountMenu()"
            >Settings</a
          >
          <button
            type="button"
            role="menuitem"
            class="account-menu-logout"
            (click)="closeAccountMenu(); signOutRequested.emit()"
          >
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>
