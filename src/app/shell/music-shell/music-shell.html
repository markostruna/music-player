<div class="workspace">
  <app-side-menu
    [isAdmin]="isAdmin()"
    [activeSection]="activeSection()"
    [isLibraryPage]="isLibraryPage()"
    [user]="user()"
    (activeSectionChange)="activeSection.set($event)"
    (signOutRequested)="signOut()"
  />

  <main class="main-panel">
    <app-shell-header
      [isLibraryPage]="isLibraryPage()"
      [searchQuery]="searchQuery()"
      [user]="user()"
      [themeOptions]="themeOptions"
      (searchQueryChange)="setSearchQuery($event)"
      (themeChange)="changeTheme($event)"
      (signOutRequested)="signOut()"
    />

    <header class="page-heading">
      <button class="page-back-button" type="button" aria-label="Go back" (click)="goBack()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="m15 18-6-6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div class="breadcrumbs">
        <span>YOUR SPACE</span>
        <span class="breadcrumb-divider">/</span>
        <strong>{{ pageTitle() }}</strong>
      </div>
    </header>

    @if (themeError()) {
      <p class="music-shell-error" role="alert">{{ themeError() }}</p>
    }
    <router-outlet />
  </main>
</div>
